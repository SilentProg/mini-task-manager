# Стек Mini Task Manager: nginx (балансувальник) -> app (N екземплярів) -> MySQL.
# Запуск:        docker compose up -d --build
# Масштабування: docker compose up -d --scale app=3
# Конфігурація:  .env (див. .env.example)

name: mini-task-manager

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?задайте MYSQL_ROOT_PASSWORD у .env}
      MYSQL_DATABASE: ${DB_NAME:-mini_task_manager}
      MYSQL_USER: ${DB_USER:-mtm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD у .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mtm-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
    image: ${DOCKERHUB_USER:-silentprog}/mini-task-manager:${APP_VERSION:-1.0}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-mini_task_manager}
      DB_USER: ${DB_USER:-mtm}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET у .env}
    # Порт назовні не відкриваємо: до app звертається лише nginx, тому можна запускати кілька екземплярів
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mtm-net
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Лише локально: назовні застосунок віддає nginx на хості за доменом (docker/nginx/host-proxy.conf)
    ports:
      - "127.0.0.1:${NGINX_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mtm-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  mtm-net:
    name: mtm-net

volumes:
  mysql-data:
    name: mtm-mysql-data
