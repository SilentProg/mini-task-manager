<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої завдання - Mini Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">✓ Mini Task Manager</a>
            <div class="d-flex align-items-center text-white">
                <span id="userInfo" class="me-3 fw-medium"></span>
                <button id="logoutBtn" class="btn btn-sm btn-outline-light rounded-pill px-3">Вийти</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 pb-5">
        <div class="row g-4">
            <!-- Список завдань -->
            <div class="col-lg-4 col-md-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-bottom-0 d-flex justify-content-between align-items-center pt-3 pb-0">
                        <h5 class="mb-0 fw-bold text-dark">Мої завдання</h5>
                        <button class="btn btn-sm btn-primary rounded-pill px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#taskModal">+ Додати</button>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush rounded-3 overflow-hidden" id="taskList">
                            <!-- Завдання генеруватимуться через JS -->
                            <div class="text-center py-4 text-muted">Завантаження...</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Деталі завдання -->
            <div class="col-lg-8 col-md-7">
                <div class="card shadow-sm border-0 h-100" id="taskDetails" style="display: none;">
                    <div class="card-header bg-white border-bottom-0 d-flex justify-content-between align-items-start pt-4 pb-2 px-4">
                        <h4 class="mb-0 fw-bold text-dark" id="detailTitle">Деталі завдання</h4>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-success rounded-pill px-3 shadow-sm" id="btnToggleComplete">Виконано</button>
                            <button class="btn btn-sm btn-danger rounded-pill px-3 shadow-sm" id="btnDeleteTask">Видалити</button>
                        </div>
                    </div>
                    <div class="card-body px-4">
                        <p class="text-secondary fs-6 mb-4" id="detailDescription">Опис відсутній</p>
                        
                        <div class="bg-light p-3 rounded-3 mt-4">
                            <h6 class="fw-bold mb-3 text-dark text-uppercase small">Підзадачі</h6>
                            
                            <!-- Форма додавання підзадачі -->
                            <form id="subtaskForm" class="d-flex gap-2 mb-3">
                                <input type="text" id="subtaskInput" class="form-control form-control-sm border-0 shadow-sm" placeholder="Що ще потрібно зробити?" required>
                                <button type="submit" class="btn btn-sm btn-primary px-3 shadow-sm">Додати</button>
                            </form>
                            
                            <!-- Список підзадач -->
                            <ul class="list-group list-group-flush bg-transparent" id="subtaskList">
                                <!-- Підзадачі будуть тут -->
                            </ul>
                        </div>
                    </div>
                </div>
                
                <!-- Заглушка, якщо завдання не обрано -->
                <div class="card shadow-sm border-0 h-100 text-center" id="noTaskSelected">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center text-muted">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-card-checklist mb-3 opacity-50" viewBox="0 0 16 16">
                            <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13z"/>
                            <path d="M7 5.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0zM7 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 0 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0z"/>
                        </svg>
                        <h5 class="fw-bold">Виберіть завдання зі списку</h5>
                        <p class="mb-0">або створіть нове, натиснувши "+ Додати"</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка створення завдання -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">Нове завдання</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-3">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">НАЗВА ЗАВДАННЯ</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">ДЕТАЛЬНИЙ ОПИС (НЕОБОВ'ЯЗКОВО)</label>
                            <textarea class="form-control" id="taskDesc" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Зберегти завдання</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
