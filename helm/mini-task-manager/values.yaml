# Значення за замовчуванням для чарту mini-task-manager.

replicaCount: 2

image:
  repository: silentprog/mini-task-manager
  # Тег образу. Порожнє значення означає appVersion з Chart.yaml.
  tag: "1.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  # ClusterIssuer cert-manager, який випускає сертифікат Let's Encrypt
  clusterIssuer: letsencrypt-prod
  host: mtm.kprojectgemfk.xyz
  tls: true

# Облікові дані. Для лабораторної вони лежать тут; у реальному проєкті їх тримають у Sealed Secrets / Vault.
secrets:
  mysqlRootPassword: change_me_root
  dbPassword: change_me_app
  jwtSecret: change_me_jwt_secret

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }

mysql:
  image: mysql:8.4
  database: mini_task_manager
  user: mtm
  # false = emptyDir (дані зникають разом із подом, зате після terraform destroy не лишається платного диска DO)
  persistence:
    enabled: false
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }
