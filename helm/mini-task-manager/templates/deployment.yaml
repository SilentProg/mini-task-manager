apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mtm.fullname" . }}
  labels:
    {{- include "mtm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
    spec:
      initContainers:
        # Застосунок ініціалізує БД (init.sql) один раз під час старту, тому чекаємо на MySQL
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "mtm.dbHost" . }} 3306; do echo waiting for db; sleep 2; done"]
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: {{ include "mtm.dbHost" . | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.database | quote }}
            - name: DB_USER
              value: {{ .Values.mysql.user | quote }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "mtm.fullname" . }}-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "mtm.fullname" . }}-secrets, key: JWT_SECRET } }
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
