apiVersion: v1
kind: Service
metadata:
  name: {{ include "mtm.fullname" . }}
  labels:
    {{- include "mtm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
