# nginx на хості (не в Docker): доступ до застосунку та моніторингу за доменом.
#   tasks.kprojectgemfk.xyz       -> застосунок  (nginx стеку, 127.0.0.1:8088)
#   cadvisor.kprojectgemfk.xyz    -> cAdvisor    (127.0.0.1:8082), під паролем
#   prometheus.kprojectgemfk.xyz  -> Prometheus  (127.0.0.1:9090), під паролем
#
# Встановлення (з кореня репозиторію на сервері; DNS A-записи мають вказувати на сервер):
#   sudo apt install -y nginx certbot python3-certbot-nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-monitoring admin
#   sudo cp docker/nginx/host-proxy.conf /etc/nginx/sites-available/mini-task-manager
#   sudo ln -s /etc/nginx/sites-available/mini-task-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect -d tasks.kprojectgemfk.xyz -d cadvisor.kprojectgemfk.xyz -d prometheus.kprojectgemfk.xyz
#
# certbot сам допише в цей файл блоки listen 443 ssl із сертифікатами та редирект з http на https.

server {
    listen 80;
    listen [::]:80;
    server_name tasks.kprojectgemfk.xyz;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# У cAdvisor і Prometheus немає власної авторизації, тому закриваємо їх паролем
server {
    listen 80;
    listen [::]:80;
    server_name cadvisor.kprojectgemfk.xyz;

    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name prometheus.kprojectgemfk.xyz;

    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-monitoring;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
