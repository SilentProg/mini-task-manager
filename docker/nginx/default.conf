# nginx усередині Compose: балансує запити між усіма екземплярами сервісу app.

# Вбудований DNS Docker. valid=5s: нові/видалені екземпляри app підхоплюються без перезапуску nginx
resolver 127.0.0.11 valid=5s ipv6=off;

# У журналі видно, який екземпляр (upstream) обробив запит
log_format upstreamlog '$remote_addr [$time_local] "$request" $status '
                       'upstream=$upstream_addr rt=$request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log upstreamlog;

    location / {
        # Змінна змушує nginx резолвити ім'я "app" динамічно (round-robin між усіма IP)
        set $app_upstream http://app:3000;
        proxy_pass $app_upstream;

        # Якщо екземпляр зупиняється під час оновлення, запит повторюється на іншому
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
